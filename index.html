<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسالة لبابا ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cairo',sans-serif;
    overflow:hidden;
    background:#000;
}

/* الصفحتين */
.page{
    width:100%;
    height:100vh;
    position:absolute;
    top:0;
    left:0;
}

/* الصفحة الأولى */
#page1{
    background:linear-gradient(to bottom,#0f2027,#203a43,#2c5364);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    transition:1s;
}

#page1 h1{
    font-size:42px;
    color:#ffcc70;
    margin-bottom:20px;
}

#page1 p{
    font-size:22px;
    margin-bottom:30px;
}

.images{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:40px;
}

.images img{
    width:220px;
    height:220px;
    object-fit:cover;
    border-radius:20px;
    border:3px solid #ffcc70;
    box-shadow:0 10px 20px rgba(0,0,0,0.5);
}

.open-btn{
    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:#ffcc70;
    color:#000;
    font-size:22px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.open-btn:hover{
    transform:scale(1.08);
}

/* الصفحة الثانية */
#page2{
    background:linear-gradient(to bottom,#0f2027,#203a43,#2c5364);
    color:white;
    display:none;
    overflow-y:auto;
    text-align:center;
    padding:30px 15px 60px;
}

#page2 h1{
    color:#ffcc70;
    font-size:40px;
    margin-top:20px;
}

.heart{
    font-size:50px;
    color:red;
    animation:pulse 1s infinite;
    margin:15px 0;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.3);}
    100%{transform:scale(1);}
}

.text{
    max-width:850px;
    margin:auto;
    font-size:22px;
    line-height:2;
    white-space:pre-line;
    padding:20px;
}

audio{
    display:none;
}

@media(max-width:600px){

    #page1 h1{
        font-size:32px;
    }

    #page1 p{
        font-size:18px;
    }

    .images img{
        width:170px;
        height:170px;
    }

    .text{
        font-size:20px;
    }

}

</style>
</head>

<body>

<!-- الصفحة الأولى -->
<div id="page1" class="page">

    <h1>❤️ My support in life ❤️</h1>

    <p></p>

    <div class="images">
        <img src="WhatsApp Image 2026-05-15 at 2.48.40 AM.jpeg">
        <img src="baba1.jpeg">
    </div>

    <button class="open-btn" onclick="openMessage()">
        open message❤️
    </button>

</div>

<!-- الصفحة الثانية -->
<div id="page2" class="page">

    <h1>❤️ A message from the botton of my heart❤️</h1>

    <div class="heart"></div>

    <div class="text" id="text"></div>

</div>

<!-- الأغنية -->
<audio id="song" loop>
    <source src="babaa Audio.mpeg" type="audio/mpeg">
</audio>

<script>

function openMessage(){

    document.getElementById("page1").style.display="none";
    document.getElementById("page2").style.display="block";

    // تشغيل الأغنية
    document.getElementById("song").play();

    // بدء الكتابة
    typeWriter();
}

const message = `


أنا عايز أبدأ كلامي إني ممتن ليك على كل حاجة عملتها عشاني ❤️  
يمكن عمري ما عبّرت لك بشكل كافي، بس صدقني أنت أهم شخص في حياتي.

انت مش بس أب، انت السند الحقيقي والظهر اللي عمري ما أستغنى عنه.  
انت كمان صديق وأمان وضحكة وسط التعب.

كل لحظة تعبت فيها عشاني أنا شايفها ومقدّرها جوا قلبي جدًا.  
حتى وقت سكوتك كان بيحكي قد إيه انت شايل همي وبتفكر في راحتي.

أنا بحس إن الدنيا أمان طول ما أنت موجود فيها، ولو غبت بحس إن حاجة كبيرة ناقصاني.  
وجودك بيفرق معايا في كل حاجة حتى في أبسط تفاصيل حياتي.

أنا فخور بيك جدًا، وفخور إنك بابا وسندي وأغلى إنسان في حياتي.  
وأي نجاح هحققه في حياتي هو بسببك أنت بعد ربنا ❤️

ربنا يخليك ليا ويطول في عمرك ويبارك فيك، ويبعد عنك أي شر أو تعب.  
وأوعدك إني هفضل دايمًا الابن اللي يرفع راسك في كل مكان ❤️

بحبك يا بابا ❤️
`;

let i = 0;
const speed = 35;

function typeWriter(){

    if(i < message.length){

        document.getElementById("text").innerHTML += message.charAt(i);

        i++;

        setTimeout(typeWriter , speed);

    }

}

</script>

</body>
</html>
